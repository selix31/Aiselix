<script>

let character = "🤖";
let botName = "Robo";

let conversation = [];

let isThinking = false;

const choiceScreen =
    document.getElementById("choiceScreen");

const app =
    document.getElementById("app");

const avatar =
    document.getElementById("avatar");

const speech =
    document.getElementById("speech");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const micButton =
    document.getElementById("micButton");

const botNameElement =
    document.getElementById("botName");


/* =========================
   PERSONNAGE
========================= */

function chooseCharacter(icon, name) {

    character = icon;
    botName = name;

    avatar.textContent = character;
    botNameElement.textContent = botName;

    choiceScreen.style.display = "none";
    app.style.display = "flex";

    conversation = [];

    const greeting =
        name === "Alex"
            ? "Salut ! 😄 Moi c'est Alex. Ça va ?"
            : name === "Emma"
            ? "Coucou ! 😊 Moi c'est Emma. Ça me fait plaisir de faire ta connaissance."
            : "Salut ! 🤖 Moi c'est Robo. Prêt à discuter ?";

    addMessage(greeting, "bot");

    speech.textContent = greeting;

    speak(greeting);
}


/* =========================
   RETOUR
========================= */

function backToChoice() {

    speechSynthesis.cancel();

    avatar.classList.remove("talking");

    app.style.display = "none";

    choiceScreen.style.display = "flex";

    conversation = [];
}


/* =========================
   ENVOYER
========================= */

async function sendMessage() {

    const text = input.value.trim();

    if (!text || isThinking) {
        return;
    }

    addMessage(text, "user");

    conversation.push({
        role: "user",
        content: text
    });

    input.value = "";

    isThinking = true;

    avatar.classList.add("thinking");

    const typing =
        document.createElement("div");

    typing.className =
        "message bot typing";

    typing.textContent =
        "Je réfléchis… 🤔";

    chat.appendChild(typing);

    chat.scrollTop =
        chat.scrollHeight;


    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    character: botName,

                    messages: conversation

                })

            });


        const data =
            await response.json();


        typing.remove();

        avatar.classList.remove("thinking");


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Erreur serveur"
            );
        }


        const answer =
            data.answer;


        addMessage(
            answer,
            "bot"
        );


        conversation.push({

            role: "assistant",

            content: answer

        });


        speech.textContent =
            answer;


        speak(answer);


    } catch (error) {

        console.error(error);

        typing.remove();

        avatar.classList.remove("thinking");

        const errorMessage =
            "Oups 😕 Je n'arrive pas à contacter mon cerveau IA pour le moment.";

        addMessage(
            errorMessage,
            "bot"
        );

        speech.textContent =
            errorMessage;

    }


    isThinking = false;
}


/* =========================
   MESSAGE
========================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================
   VOIX
========================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "fr-FR";

    utterance.rate = 0.96;

    if (botName === "Emma") {
        utterance.pitch = 1.08;
    }

    else if (botName === "Alex") {
        utterance.pitch = 0.94;
    }

    else {
        utterance.pitch = 1;
    }

    utterance.onstart = () => {

        avatar.classList.add(
            "talking"
        );

    };

    utterance.onend = () => {

        avatar.classList.remove(
            "talking"
        );

    };

    speechSynthesis.speak(
        utterance
    );
}


/* =========================
   MICRO
========================= */

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "La reconnaissance vocale n'est pas disponible dans ce navigateur."
        );

        return;
    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    micButton.classList.add(
        "listening"
    );

    micButton.textContent =
        "⏹";


    recognition.start();


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                .transcript;

            input.value =
                text;

            sendMessage();
        };


    recognition.onerror =
        function() {

            micButton.classList.remove(
                "listening"
            );

            micButton.textContent =
                "🎤";
        };


    recognition.onend =
        function() {

            micButton.classList.remove(
                "listening"
            );

            micButton.textContent =
                "🎤";
        };
}


/* =========================
   ENTER
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }

    }
);

</script>
